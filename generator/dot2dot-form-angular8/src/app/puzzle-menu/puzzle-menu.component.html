<nav class="puzzle-menu" aria-label="Puzzle library">

  <div class="menu-field">
    <label for="menu-lang-select">Language</label>
    <select
      id="menu-lang-select"
      data-testid="menu-lang-select"
      [(ngModel)]="selectedLang"
      (ngModelChange)="onLanguageChange()">
      <option *ngFor="let lang of languages" [value]="lang.code">{{ lang.label }}</option>
    </select>
  </div>

  <div class="menu-field">
    <label for="menu-search" class="visually-hidden">Search puzzles</label>
    <input
      id="menu-search"
      type="search"
      role="searchbox"
      autocomplete="off"
      data-testid="menu-search"
      placeholder="Search puzzles…"
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearchChange()"
      aria-describedby="menu-search-status" />
    <div
      id="menu-search-status"
      class="menu-search-status"
      data-testid="menu-search-status"
      aria-live="polite">{{ searchStatusText }}</div>
  </div>

  <div class="menu-tree-wrap">
    <ul
      class="menu-tree"
      role="tree"
      aria-label="Puzzle categories"
      data-testid="menu-tree"
      *ngIf="visibleCategories.length; else emptyState">
      <li *ngFor="let cat of visibleCategories; let ci = index; trackBy: trackByCategory">
        <button
          type="button"
          role="treeitem"
          class="menu-category-btn"
          [attr.aria-expanded]="isExpanded(cat.key)"
          [attr.aria-level]="1"
          [attr.aria-setsize]="visibleCategories.length"
          [attr.aria-posinset]="ci + 1"
          [attr.data-testid]="'menu-category-' + cat.key"
          (click)="toggleCategory(cat.key)">
          <span class="menu-caret" [class.open]="isExpanded(cat.key)" aria-hidden="true">▸</span>
          <span class="menu-category-label">{{ cat.label }}</span>
          <span class="menu-count">({{ cat.puzzles.length }})</span>
        </button>

        <ul class="menu-puzzle-list" role="group" *ngIf="isExpanded(cat.key)">
          <li *ngFor="let p of cat.puzzles; let pi = index; trackBy: trackByPuzzle">
            <button
              type="button"
              role="treeitem"
              class="menu-puzzle-btn"
              [class.active]="isActive(cat.key, p.slug)"
              [class.unavailable]="!p.available"
              [class.loading]="isLoading(cat.key, p.slug)"
              [attr.aria-selected]="isActive(cat.key, p.slug)"
              [attr.aria-disabled]="!p.available"
              [attr.aria-busy]="isLoading(cat.key, p.slug)"
              [attr.aria-level]="2"
              [attr.aria-setsize]="cat.puzzles.length"
              [attr.aria-posinset]="pi + 1"
              [attr.data-testid]="'menu-puzzle-' + cat.key + '-' + p.slug"
              (click)="selectPuzzle(cat.key, p.slug)"
              (keydown)="onPuzzleKeydown($event, cat.key, p.slug)">
              <span>{{ p.name }}</span>
              <span class="menu-availability" *ngIf="!p.available">Not translated</span>
            </button>
          </li>
        </ul>
      </li>
    </ul>

    <ng-template #emptyState>
      <p class="menu-empty" data-testid="menu-empty-state">No puzzles match</p>
    </ng-template>
  </div>

  <p class="menu-error" *ngIf="loadError" data-testid="menu-error">{{ loadError }}</p>
</nav>
