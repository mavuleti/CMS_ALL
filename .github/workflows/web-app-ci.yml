name: web-app CI

on:
  push:
    paths:
      - 'CMS/web-app/**'
      - '.github/workflows/web-app-ci.yml'
  pull_request:
    paths:
      - 'CMS/web-app/**'
      - '.github/workflows/web-app-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CMS/web-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: CMS/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run test suite
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: CMS/web-app/playwright-report/
          retention-days: 14
